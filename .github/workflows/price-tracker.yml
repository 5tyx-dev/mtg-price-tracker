name: MTG Price Tracker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-connection:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Card Kingdom pricing CSV
        run: python scripts/price_tracker.py

      - name: Upload pricing CSV
        uses: actions/upload-artifact@v4
        with:
          name: ck-prices-test
          path: output/ck_prices_test.csv
          if-no-files-found: error
          retention-days: 7
